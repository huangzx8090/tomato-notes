name: macOS 与 Windows CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      package:
        description: 生成 Universal ZIP 与 DMG 预览安装包（不发布 Release）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: 分支约定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.package.outputs.required }}
      run_ci: ${{ steps.run-ci.outputs.required }}
    steps:
      - name: 检出规则
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查 PR 来源与目标
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: Scripts/check-branch-policy.sh "$BASE_REF" "$HEAD_REF"
      - name: 验证打包触发规则
        run: python3 Scripts/test-ci-package-policy.py
      - name: 核对产品与两端版本
        run: |
          python3 Scripts/test-version-policy.py
          python3 Scripts/check-versions.py
      - name: 判断是否需要重复运行完整 CI
        id: run-ci
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          required=true
          if [[ "$CI_EVENT_NAME" == pull_request \
              && ( "$CI_BASE_REF" == main && "$CI_HEAD_REF" == develop \
                  || "$CI_BASE_REF" == develop && "$CI_HEAD_REF" == main ) ]]; then
            if git cat-file -e "$CI_HEAD_SHA^{commit}" 2>/dev/null \
                && [[ "$(git rev-parse "$CI_HEAD_SHA^{tree}")" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
              echo 'main 与 develop 的同步 PR 合并结果和来源分支内容一致，来源分支已有 push CI，跳过重复的完整 CI。'
              required=false
            else
              echo 'PR 合并结果与来源分支内容不同，保留完整 CI。'
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: 判断是否需要验证安装包
        id: package
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PACKAGE: ${{ inputs.package || false }}
        run: |
          required="$(Scripts/ci-package-needed.sh)"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: 测试与编译
    needs: branch-policy
    if: needs.branch-policy.outputs.run_ci == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 显示工具链
        run: |
          xcodebuild -version
          swift --version
      - name: 检查脚本与数据格式
        run: |
          for script in Scripts/*.sh apps/macos/Scripts/*.sh; do bash -n "$script"; done
          plutil -lint apps/macos/Packaging/Info.plist
          git diff --check
      - name: 运行规则与接口测试
        run: apps/macos/Scripts/test.sh
      - name: 编译当前架构应用
        run: swift build --package-path apps/macos -c debug --product TomatoNotes

  windows-test-and-build:
    name: Windows 核心测试与编译
    needs: branch-policy
    if: needs.branch-policy.outputs.run_ci == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: 运行核心与模拟接口测试
        run: dotnet run --project apps/windows/TomatoNotes.Tests/TomatoNotes.Tests.csproj -c Release
      - name: 编译 WPF 应用
        run: dotnet build apps/windows/TomatoNotes/TomatoNotes.csproj -c Release

  windows-package:
    name: Windows 安装包验证
    needs: [branch-policy, windows-test-and-build]
    if: needs.branch-policy.outputs.package == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: 安装 Inno Setup 并打包
        run: |
          choco install innosetup --yes --no-progress
          powershell -ExecutionPolicy Bypass -File apps/windows/Scripts/package-windows.ps1
      - name: 保存安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TomatoNotes-Windows-x64
          path: build/releases/*/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package:
    name: 双架构安装包验证
    needs: [branch-policy, test-and-build]
    if: needs.branch-policy.outputs.package == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 构建并验证 Universal ZIP 与 DMG
        run: apps/macos/Scripts/package-release.sh
      - name: 保存安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TomatoNotes-macOS-universal
          path: build/releases/*/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

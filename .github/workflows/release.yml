name: 发布 macOS 与 Windows 应用

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在并已合入 main 的版本标签，例如 v1.3.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: 验证标签并构建 macOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: 检出标签与完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对标签、版本与主分支
        run: Scripts/validate-release.sh "$RELEASE_TAG"
      - name: 运行规则与接口测试
        run: apps/macos/Scripts/test.sh
      - name: 构建并校验发布文件
        run: |
          apps/macos/Scripts/package-release.sh "$RELEASE_TAG"
          cp "docs/releases/$RELEASE_TAG.md" build/release-notes.md
      - name: 保存发布文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            build/releases/*/*
            build/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 检出标签与完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对标签、版本与主分支
        shell: bash
        run: |
          # checkout fetch-depth 0 已检出完整分支历史；凭据不持久化时不要重复访问远程。
          Scripts/validate-release.sh "$RELEASE_TAG"
      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: 运行 Windows 核心与模拟接口测试
        run: dotnet run --project apps/windows/TomatoNotes.Tests/TomatoNotes.Tests.csproj -c Release
      - name: 安装 Inno Setup 并打包
        run: |
          choco install innosetup --yes --no-progress
          powershell -ExecutionPolicy Bypass -File apps/windows/Scripts/package-windows.ps1
      - name: 校验 Windows 发布附件
        shell: bash
        run: |
          test -s "build/releases/$RELEASE_TAG/TomatoNotes-$RELEASE_TAG-Windows-x64-setup.exe"
          cp apps/windows/Packaging/安装说明.txt "build/releases/$RELEASE_TAG/WINDOWS-INSTALL.txt"
          cd "build/releases/$RELEASE_TAG"
          sha256sum -c WINDOWS-SHA256SUMS.txt
      - name: 保存 Windows 发布文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-files
          path: build/releases/*/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: 上传并发布 GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 获取已验证的安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release-files
      - name: 获取 Windows 安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release-files
          path: windows-release-files
      - name: 发布版本与附件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp -R "windows-release-files/$RELEASE_TAG/." "release-files/releases/$RELEASE_TAG/"
          cd "release-files/releases/$RELEASE_TAG"
          cat WINDOWS-SHA256SUMS.txt >> SHA256SUMS.txt
          rm WINDOWS-SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo '此版本已正式发布；请创建新版本，避免覆盖已有下载。' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "番茄小记 $RELEASE_TAG" \
              --notes-file ../../release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip ./*.exe SHA256SUMS.txt INSTALL.txt WINDOWS-INSTALL.txt --clobber
          expected_assets="$(printf '%s\n' INSTALL.txt WINDOWS-INSTALL.txt SHA256SUMS.txt \
            "TomatoNotes-$RELEASE_TAG-macOS-universal.dmg" \
            "TomatoNotes-$RELEASE_TAG-macOS-universal.zip" \
            "TomatoNotes-$RELEASE_TAG-Windows-x64-setup.exe" | sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | .[]')"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo '服务器上的附件名与校验清单不一致，保留草稿供排查。' >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --notes-file ../../release-notes.md
